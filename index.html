<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>iPhone Duo Illusion Test</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Screen viewport frame */
    #viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    /* Anchored layer */
    #content-layer {
      position: absolute;
      width: 140vw;
      height: 140vh;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      will-change: transform, filter;
      transition: filter 0.05s linear;
      transform-origin: center center;
    }

    /* Dynamic Duo edge darkening & shadow masks */
    .edge-shadow {
      position: absolute;
      pointer-events: none;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 45px rgba(0, 0, 0, 0.95),
                  inset 40px 0 60px rgba(0, 0, 0, 0.8),
                  inset -40px 0 60px rgba(0, 0, 0, 0.8);
      z-index: 5;
      mix-blend-mode: multiply;
      transition: opacity 0.1s ease-out;
    }

    /* UI Setup Overlay */
    #setup-ui {
      position: absolute;
      z-index: 10;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 24px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      color: #fff;
      max-width: 85%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    #setup-ui h2 {
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
    }

    .btn {
      background: #007aff;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 500;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
      text-align: center;
    }

    .btn:active {
      background: #0056b3;
    }

    input[type="file"] {
      display: none;
    }

    /* Tap anywhere reset trigger */
    #touch-reset {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 6;
      display: none;
    }
  </style>
</head>
<body>

  <div id="viewport">
    <div id="content-layer"></div>
    <div id="shadow" class="edge-shadow"></div>
    
    <div id="touch-reset"></div>

    <div id="setup-ui">
      <h2>iPhone Duo Anchor Effect</h2>
      
      <label class="btn" for="file-input">
        Select Screenshot
      </label>
      <input type="file" id="file-input" accept="image/*" />

      <button class="btn" id="start-btn" style="background: #34c759; display: none;">
        Enable Gyro & Start
      </button>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('file-input');
    const startBtn = document.getElementById('start-btn');
    const setupUI = document.getElementById('setup-ui');
    const contentLayer = document.getElementById('content-layer');
    const shadowLayer = document.getElementById('shadow');
    const touchReset = document.getElementById('touch-reset');

    let initialHeading = null;
    let initialBeta = null;
    let initialGamma = null;

    // 1. Upload screenshot
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          contentLayer.style.backgroundImage = `url(${event.target.result})`;
          startBtn.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });

    // 2. Request iOS Motion Permissions & Calibrate
    startBtn.addEventListener('click', async () => {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const response = await DeviceOrientationEvent.requestPermission();
          if (response === 'granted') {
            beginExperience();
          } else {
            alert('Sensor permission required for the spatial effect.');
          }
        } catch (err) {
          console.error(err);
          beginExperience();
        }
      } else {
        // Non-iOS or older permission model
        beginExperience();
      }
    });

    function beginExperience() {
      setupUI.style.display = 'none';
      touchReset.style.display = 'block';

      window.addEventListener('deviceorientation', handleOrientation);
    }

    // Tap screen once to recalibrate zero position
    touchReset.addEventListener('click', () => {
      initialHeading = null;
      initialBeta = null;
      initialGamma = null;
    });

    function handleOrientation(e) {
      // Compass heading (alpha / webkitCompassHeading)
      let heading = e.webkitCompassHeading || (360 - e.alpha);
      let beta = e.beta;   // front-to-back tilt (-180 to 180)
      let gamma = e.gamma; // left-to-right tilt (-90 to 90)

      // Set initial rest reference
      if (initialHeading === null && heading !== undefined) {
        initialHeading = heading;
        initialBeta = beta;
        initialGamma = gamma;
      }

      // Calculate deviation from reference
      let deltaRot = heading - initialHeading;
      // Handle 360 wrap-around
      if (deltaRot > 180) deltaRot -= 360;
      if (deltaRot < -180) deltaRot += 360;

      let deltaX = (gamma - initialGamma);
      let deltaY = (beta - initialBeta);

      // Total angular offset magnitude
      const totalDeviation = Math.sqrt(deltaRot * deltaRot + deltaX * deltaX + deltaY * deltaY);

      // Map dynamic blur (scales with movement)
      const blurAmount = Math.min(Math.max(totalDeviation * 0.45, 0), 18);

      // Duo-style side darkening calculation
      const sideDarkness = Math.min(Math.max(0.4 + (totalDeviation * 0.03), 0.4), 1.0);
      const edgeSpread = Math.min(Math.max(40 + (totalDeviation * 2), 40), 90);

      // Invert rotation so image remains stationary on table
      contentLayer.style.transform = `
        rotate(${-deltaRot}deg) 
        translate(${-deltaX * 3.5}px, ${-deltaY * 3.5}px)
      `;

      // Apply Duo frosted blur
      contentLayer.style.filter = `blur(${blurAmount}px) brightness(${1 - (totalDeviation * 0.008)})`;

      // Dynamically push side shadows inward as angle increases
      shadowLayer.style.opacity = sideDarkness;
      shadowLayer.style.boxShadow = `
        inset 0 0 50px rgba(0,0,0,0.9),
        inset ${edgeSpread}px 0 ${edgeSpread * 1.5}px rgba(0, 0, 0, 0.95),
        inset -${edgeSpread}px 0 ${edgeSpread * 1.5}px rgba(0, 0, 0, 0.95)
      `;
    }
  </script>
</body>
</html>
